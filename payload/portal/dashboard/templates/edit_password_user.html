{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<h1>Edit User: {{ user.username }}</h1>
<div class="card" style="max-width:480px;">
  <form method="post" action="{{ url_for('edit_password_user', username=user.username) }}">
    <label>Plan</label>
    <select name="plan_id" required style="width:100%;margin-bottom:12px;">
      {% for p in plans %}
      <option value="{{ p.id }}" {{ 'selected' if p.id == user.plan_id }}>{{ p.name }}</option>
      {% endfor %}
    </select>
    <label>New Password</label>
    <input type="text" name="password" placeholder="leave blank to keep current" style="width:100%;margin-bottom:16px;">
    <button type="submit">Save changes</button>
    <a href="{{ url_for('all_users') }}" class="btn" style="background:#8a8f98;">Cancel</a>
  </form>
</div>
{% endblock %}
