{% extends "base.html" %}
{% block title %}Edit Voucher{% endblock %}
{% block content %}
<h1>Edit Voucher: {{ voucher.code }}</h1>
<div class="card" style="max-width:480px;">
  <form method="post" action="{{ url_for('edit_voucher', code=voucher.code) }}">
    <label>Plan</label>
    <select name="plan_id" required style="width:100%;margin-bottom:12px;">
      {% for p in plans %}
      <option value="{{ p.id }}" {{ 'selected' if p.id == voucher.plan_id }}>{{ p.name }}</option>
      {% endfor %}
    </select>
    <label>Max uses</label>
    <input type="number" name="max_uses" value="{{ voucher.max_uses }}" style="width:100%;margin-bottom:12px;">
    <label>Expires in (days from now)</label>
    <input type="number" name="valid_days" placeholder="leave blank to keep current expiry" style="width:100%;margin-bottom:12px;">
    <label>Batch label</label>
    <input type="text" name="batch_label" value="{{ voucher.batch_label or '' }}" style="width:100%;margin-bottom:16px;">
    <button type="submit">Save changes</button>
    <a href="{{ url_for('all_users') }}" class="btn" style="background:#8a8f98;">Cancel</a>
  </form>
</div>
{% endblock %}
